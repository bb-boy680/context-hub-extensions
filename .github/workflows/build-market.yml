# Build the installable market on main.
#
# Source branches do not commit `plugins/*/lib/` or `marketplace.json`; both are
# ignored there. This workflow runs the checks on every push to main, builds the
# plugins and the index, and commits those generated files back as the bot. The
# hub reads the raw index from main and clones main for the plugin files, so
# this bot commit is what makes an install possible.
#
# The push must be allowed by branch protection: give github-actions[bot] write
# access (or a bypass) on main, otherwise the commit step fails and main keeps
# the old artifacts. A push generated with GITHUB_TOKEN does not start another
# workflow run; `[skip ci]` and the actor guard are a second line of defense.
name: build-market

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plugins/*/lib marketplace.json
          if git diff --cached --quiet; then
            echo "no artifact changes"
            exit 0
          fi
          git commit -m "chore: build market artifacts [skip ci]"
          git push
