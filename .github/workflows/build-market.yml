# Build the installable market on a pull request.
#
# Source branches do not commit `plugins/*/lib/` or `marketplace.json`; both are
# ignored there. This workflow runs the checks on every pull request to main,
# builds the plugins and the index, and commits those generated files back to
# the pull request's own branch as the bot. The hub reads the raw index from
# main and clones main for the plugin files, so the artifacts have to be in the
# branch before it merges.
#
# main is protected by the "main: pull requests only" ruleset: nobody,
# administrators included, pushes to it directly, and the ruleset has no bypass
# list. This workflow therefore never pushes to main. The bot commit to the PR
# branch carries `[skip ci]`, and the actor guard is a second line of defense.
#
# A pull request from a fork cannot be written with GITHUB_TOKEN, so the job
# skips forks; this repository expects first-party branches.
name: build-market

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-market-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plugins/*/lib marketplace.json
          if git diff --cached --quiet; then
            echo "no artifact changes"
            exit 0
          fi
          git commit -m "chore: build market artifacts [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
