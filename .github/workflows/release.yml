# Publish the changelog for a version tag.
#
# The market itself is read from main; this workflow only turns the commits
# since the previous tag into the GitHub Release notes and creates the release.
# Tag after the build-market bot commit, so the tag points at the commit that
# already carries marketplace.json and the plugin lib/ files.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            node scripts/changelog.mjs --from "$PREV" --to "$TAG" --repo "$REPO" > release-notes.md
          else
            node scripts/changelog.mjs --to "$TAG" --repo "$REPO" > release-notes.md
          fi
      - name: update changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git restore --source=HEAD -- marketplace.json plugins/*/lib 2>/dev/null || true
          git fetch origin main
          git checkout main
          if [ -n "$PREV" ]; then
            node scripts/changelog.mjs --from "$PREV" --to "$TAG" --repo "$REPO" --changelog CHANGELOG.md
          else
            node scripts/changelog.mjs --to "$TAG" --repo "$REPO" --changelog CHANGELOG.md
          fi
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog already carries $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for $TAG [skip ci]"
          git push origin main
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Context Hub Extensions $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Context Hub Extensions $TAG" --notes-file release-notes.md
          fi
