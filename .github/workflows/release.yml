# Publish the changelog for a version tag.
#
# The market itself is read from main; this workflow turns the commits since
# the previous tag into GitHub Release notes, creates the release, and opens a
# pull request that brings CHANGELOG.md up to date. main requires a pull
# request and has no bypass list, so the changelog is never pushed there
# directly: the bot opens its own PR and merges it (zero required approvals).
#
# Tag after the release pull request has merged. The tag then points at a
# commit that already carries marketplace.json and the plugin lib/ files.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            node scripts/changelog.mjs --from "$PREV" --to "$TAG" --repo "$REPO" > release-notes.md
          else
            node scripts/changelog.mjs --to "$TAG" --repo "$REPO" > release-notes.md
          fi
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Context Hub Extensions $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Context Hub Extensions $TAG" --notes-file release-notes.md
          fi
      - name: update changelog through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/release-${TAG}-${GITHUB_RUN_ID}"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          if [ -n "$PREV" ]; then
            node scripts/changelog.mjs --from "$PREV" --to "$TAG" --repo "$REPO" --changelog CHANGELOG.md
          else
            node scripts/changelog.mjs --to "$TAG" --repo "$REPO" --changelog CHANGELOG.md
          fi
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog already carries $TAG"
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for $TAG [skip ci]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): update changelog for $TAG" \
            --body "Generated by the release workflow for $TAG."
          gh pr merge "$BRANCH" --merge --delete-branch
